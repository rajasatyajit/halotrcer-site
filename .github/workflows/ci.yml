name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Manual runs also include the Firefox and WebKit browser tests.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every job runs on LINUX_RUNNER (a repository variable, e.g. a self-hosted
  # runner's label) only while the repository is private; a public repository
  # always runs on GitHub-hosted runners (docs/development.md).
  verify:
    name: Types, lint, unit tests, audit
    runs-on: ${{ github.event.repository.private && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner tools (self-hosted only)
        if: runner.environment == 'self-hosted'
        run: sh scripts/ci/runner-tools.sh git tar gzip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Shipped dependencies only: the dev-only braces advisory (lint tooling) has no fix upstream.
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Build ${{ matrix.site }} (launched=${{ matrix.launched }})
    runs-on: ${{ github.event.repository.private && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        site: [www, tokvera, sievant]
        launched: ['false', 'true']
    env:
      LAUNCHED: ${{ matrix.launched }}
      # Launched-mode builds use fixture release data (v0.0.0-fixture): nothing is released yet.
      RELEASE_DATA_DIR: ${{ matrix.launched == 'true' && '.cache/fixture-releases' || '' }}
      ALLOW_CANDIDATE_SCRIPTS: ${{ matrix.launched == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner tools (self-hosted only)
        if: runner.environment == 'self-hosted'
        run: sh scripts/ci/runner-tools.sh git tar gzip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fixture release data
        if: matrix.launched == 'true'
        run: npm run fixtures:releases
      - run: npm run build -- --site ${{ matrix.site }}
      - name: HTML validation
        run: npm run check:html
      - name: Security headers and CSP
        run: npm run check:headers
      - name: Honesty (no unsourced numbers or customer proof)
        run: npm run check:claims
      - name: Budgets
        run: npm run budget
      - name: Pre-launch mode
        if: matrix.launched == 'false'
        run: npm run check:prelaunch
      - name: Launched mode (every channel present and resolved, scripts byte-identical)
        if: matrix.launched == 'true'
        run: npm run check:launched
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.site }}-launched-${{ matrix.launched }}
          path: dist/${{ matrix.site }}
          retention-days: 7

  cross-host:
    name: Links and SEO across all hosts (launched=${{ matrix.launched }})
    runs-on: ${{ github.event.repository.private && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        launched: ['false', 'true']
    env:
      LAUNCHED: ${{ matrix.launched }}
      # Launched-mode builds use fixture release data (v0.0.0-fixture): nothing is released yet.
      RELEASE_DATA_DIR: ${{ matrix.launched == 'true' && '.cache/fixture-releases' || '' }}
      ALLOW_CANDIDATE_SCRIPTS: ${{ matrix.launched == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner tools (self-hosted only)
        if: runner.environment == 'self-hosted'
        run: sh scripts/ci/runner-tools.sh git tar gzip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fixture release data
        if: matrix.launched == 'true'
        run: npm run fixtures:releases
      - run: npm run build
      - name: Launched mode across all hosts
        if: matrix.launched == 'true'
        run: npm run check:launched
      - name: Internal links, cross-host links and fragments
        run: npm run check:links
      - name: Published URLs never break (data/published-urls.json)
        run: npm run check:permanence
      - name: Unique titles and descriptions across hosts
        run: npm run check:seo

  e2e:
    name: Accessibility (axe) and browser tests (launched=${{ matrix.launched }})
    runs-on: ${{ github.event.repository.private && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        launched: ['false', 'true']
    env:
      LAUNCHED: ${{ matrix.launched }}
      RELEASE_DATA_DIR: ${{ matrix.launched == 'true' && '.cache/fixture-releases' || '' }}
      ALLOW_CANDIDATE_SCRIPTS: ${{ matrix.launched == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner tools (self-hosted only)
        if: runner.environment == 'self-hosted'
        run: sh scripts/ci/runner-tools.sh git tar gzip sudo sudo-nopasswd apt-get
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fixture release data
        if: matrix.launched == 'true'
        run: npm run fixtures:releases
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-launched-${{ matrix.launched }}
          path: test-results
          retention-days: 7

  e2e-browsers:
    name: Browser tests in ${{ matrix.browser }} (launched=${{ matrix.launched }})
    # Firefox and WebKit on main and on manual runs only (PLAN.md §10).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.event.repository.private && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        launched: ['false', 'true']
    env:
      LAUNCHED: ${{ matrix.launched }}
      RELEASE_DATA_DIR: ${{ matrix.launched == 'true' && '.cache/fixture-releases' || '' }}
      ALLOW_CANDIDATE_SCRIPTS: ${{ matrix.launched == 'true' && '1' || '0' }}
      PW_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner tools (self-hosted only)
        if: runner.environment == 'self-hosted'
        run: sh scripts/ci/runner-tools.sh git tar gzip sudo sudo-nopasswd apt-get
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fixture release data
        if: matrix.launched == 'true'
        run: npm run fixtures:releases
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.browser }}-launched-${{ matrix.launched }}
          path: test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse ${{ matrix.site }} (launched=${{ matrix.launched }})
    needs: build
    runs-on: ${{ github.event.repository.private && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        site: [www, tokvera, sievant]
        launched: ['false', 'true']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner tools (self-hosted only)
        if: runner.environment == 'self-hosted'
        run: sh scripts/ci/runner-tools.sh git tar gzip sudo sudo-nopasswd apt-get
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/lhci/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.site }}-launched-${{ matrix.launched }}
          path: dist/${{ matrix.site }}
      - run: npm ci --prefix tools/lhci
      # Install Chromium here rather than relying on a browser in the runner image,
      # so the job also runs on a self-hosted runner (docs/development.md).
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lighthouse CI (mobile, budgets asserted)
        env:
          SITE: ${{ matrix.site }}
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          tools/lhci/node_modules/.bin/lhci autorun --config=lighthouserc.cjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.site }}-launched-${{ matrix.launched }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
