      quote: 'TestProxyOverheadBudget p99 overhead',
    }

- id: sievant.quickstart-terminal
  text: |-
    $ sievant scan        # read-only: what is risky in your MCP client configurations
    $ sievant wrap --all  # route those servers through Sievant (backs up every file first)
    $ sievant ui          # calls, decisions, blocked actions and redactions (127.0.0.1, one-time link)
    $ sievant unwrap      # restore the original configurations, byte for byte
  source:
    repo: sievant
    path: README.md
    lines: '34-42'
    commit: 8529db16ad9ab178c7131966ba1c6fa5588047fc
    quote: >-
      sievant scan # read-only: what is risky in your MCP client configurations sievant wrap --all #
      route those servers through Sievant (backs up every file first)

