# ---- Sievant site ----

- id: sievant.local
  text: >-
    On a developer's machine, in front of the MCP servers that Claude Desktop, Claude Code, Cursor, VS
    Code and Windsurf launch: sievant scan audits their configurations, sievant wrap routes the
    servers through Sievant, and sievant ui shows what happened.
  source:
    repo: sievant
    path: README.md
    lines: '11-14'
    commit: 8529db16ad9ab178c7131966ba1c6fa5588047fc
    quote: >-
      On a developer's machine, in front of the MCP servers that Claude Desktop, Claude Code, Cursor,
      VS Code and Windsurf launch.

- id: sievant.gateway
  text: >-
    As a gateway for a team or a cluster: one process, or a Kubernetes sidecar, that serves
    databases, REST and gRPC APIs, Prometheus and Loki, and other MCP servers as tools, with
    identity, per-agent policies and rate limits.
  source:
    repo: sievant
    path: README.md
    lines: '15-18'
    commit: 8529db16ad9ab178c7131966ba1c6fa5588047fc
    quote: >-
      As a gateway for a team or a cluster: one process, or a Kubernetes sidecar, that serves
      databases, REST and gRPC APIs, Prometheus and Loki, and other MCP servers as tools, with
      identity, per-agent policies and rate limits.

- id: sievant.speed
  text: It adds about 0.25 ms per call at the 99th percentile (proxy overhead, measured on a development machine).
  source:
    repo: sievant
    path: README.md
    lines: '21-22'
    commit: 8529db16ad9ab178c7131966ba1c6fa5588047fc
    quote: It adds about 0.25 ms per call at the 99th percentile on a laptop

- id: sievant.speed-basis
  text: >-
    The figure is the proxy-overhead p99 from the TestProxyOverheadBudget runs recorded in the
    repository's BASELINE.md; the release gate is 2 ms.
  source:
    {
      repo: sievant,
