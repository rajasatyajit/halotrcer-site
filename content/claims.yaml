# ---- www home ----

- id: halotrcer.check-flow
  text: >-
    Tokvera sends load to your endpoint, so Halotrcer shows Tokvera's plan and asks first. Sievant
    only reads configuration files. The result is one report, in HTML, PDF and JSON.
  source:
    repo: halotrcer
    path: cmd/halotrcer/check.go
    lines: '26-27'
    commit: c19c0d91da6bbefd22ab80f3834cf65e2c57ce51
    quote: >-
      Tokvera sends load to the target: halotrcer shows Tokvera's plan and asks first, or give
      --yes. Sievant only reads configuration files.

- id: halotrcer.privacy
  text: >-
    Halotrcer contacts only the target you give it (through Tokvera) and reads only the MCP
    configuration files Sievant reads, on this machine. It sends no telemetry. Secrets stay masked
    as each tool masks them; on top of that, Halotrcer drops URL credentials and query strings,
    hides environment values, shows your home directory as ~ and replaces your user name with
    <user>.
  source:
    repo: halotrcer
    path: internal/report/model.go
    lines: '39'
    commit: c19c0d91da6bbefd22ab80f3834cf65e2c57ce51
    quote: 'configuration files Sievant reads, on this machine. It sends no telemetry.'

- id: tokvera.measures
  text: >-
    Time to first token and latency percentiles at rising concurrency, error rates, cost per 1,000
    requests, and whether repeated prompts are worth caching.
  source:
    repo: tokvera
    path: README.md
    lines: '7-10'
    commit: 0f37696950d5ea62c83e7342b2ae8bd1c37e4417
    quote: >-
      - time to first token, and latency percentiles at rising concurrency; - error rates; - cost
      per 1,000 requests; - whether repeated prompts are worth caching.

- id: sievant.scan-finds
  text: >-
    Credentials and secret values in MCP configuration files, servers given the filesystem root or
    your whole home directory, and remote servers with no credential or over plain HTTP.
  source:
    repo: halotrcer
    path: docs/scoring.md
    lines: '49-52'
    commit: c19c0d91da6bbefd22ab80f3834cf65e2c57ce51
    quote: >-
      a credential, secret value, URL password or capability URL in a configuration file | |
      AUTH001 | a remote server with no credential | | NET001 | a remote server over plain HTTP | |
      PERM001, PERM002 | the filesystem root or the whole home directory given to a server

- id: halotrcer.fix-plan
  text: >-
    Both tools' findings merge into one ranked list and a 30-day fix plan. The fix text is each
    tool's own: Halotrcer adds no advice of its own.
  source:
    repo: halotrcer
    path: docs/scoring.md
    lines: '88'
    commit: c19c0d91da6bbefd22ab80f3834cf65e2c57ce51
    quote: >-
      The fix text is the tool's own: Tokvera's suggested_fix or Sievant's fix. Halotrcer writes no
      remediation advice of its own.

- id: halotrcer.no-savings
  text: There is no savings figure anywhere, because neither tool measures what a fix would save.
  source:
    repo: halotrcer
    path: docs/scoring.md
    lines: '97'
    commit: c19c0d91da6bbefd22ab80f3834cf65e2c57ce51
    quote: There is no savings figure anywhere, because neither tool measures what a fix would save.

- id: halotrcer.provisional
  text: >-
    The ranking is provisional: its tiers are judgement, not calibrated against real results, and
    may change.
  source:
    repo: halotrcer
    path: docs/scoring.md
    lines: '3-5'
    commit: c19c0d91da6bbefd22ab80f3834cf65e2c57ce51
    quote: >-
      Its tiers are judgement, not calibrated against real results, and may change before 1.0.0.

- id: halotrcer.report-sections
  text: Executive summary, Cost & performance, Agent security, 30-day fix plan, How to read this report.
  source:
    {
      repo: halotrcer,
      path: internal/report/html.go,
      lines: '94',
      commit: c19c0d91da6bbefd22ab80f3834cf65e2c57ce51,
      quote: '<h2>Executive summary</h2>',
    }

# ---- security ----

- id: security.ack
  text: We aim to acknowledge reports within 5 business days, and to tell you what happens next.
  source:
    repo: tokvera
    path: SECURITY.md
    lines: '16-17'
    commit: 0f37696950d5ea62c83e7342b2ae8bd1c37e4417
    quote: We aim to acknowledge reports within 5 business days, and to tell you what happens next.

- id: security.signature
  text: >-
    Every release's checksums.txt is signed with cosign, keyless, by the repository's release
    workflow running on a version tag. The install scripts check that signature when cosign is
    installed, and always check the SHA-256 of what they download.
  source:
    repo: tokvera
    path: SECURITY.md
    lines: '27-30'
    commit: 0f37696950d5ea62c83e7342b2ae8bd1c37e4417
    quote: >-
      every release's checksums.txt is signed with cosign, keyless, by this repository's release
      workflow running on a version tag.

- id: security.provenance
  text: >-
    Every archive, package, SBOM and the container image carries a SLSA v1 build provenance
    attestation from the same workflow.
  source:
    repo: tokvera
    path: SECURITY.md
    lines: '31-32'
    commit: 0f37696950d5ea62c83e7342b2ae8bd1c37e4417
    quote: >-
      every archive, package, SBOM and the container image carries a SLSA v1 build provenance
      attestation from the same workflow.

